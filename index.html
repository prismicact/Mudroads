<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudroads</title>
    <link rel="icon" type="image/png" href="assets/misc/icon.png?v=2">
    <style>
        @font-face {
            font-family: 'MyPixelFont';
            src: url('fonts/PressStart2P-Regular.ttf') format('truetype');
        }

        html, body, * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw; height: 100vh;
            background-color: #000000;
            display: block; font-family: sans-serif;
        }

        #debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 14px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            z-index: 9999;
        }

        /* ... (Keep your existing styles for leaderboard, arcade-overlay, etc.) ... */
        
        #game-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgb(20, 20, 20), rgb(8, 8, 8));
        }

        /* ... (Keep the rest of your existing CSS as it was) ... */
    </style>
</head>
<body>
    <div id="debug-panel">
        <div id="screen-size-debug">Size: 0 x 0</div>
        <div id="key-click-debug">Key Clicked: None</div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
